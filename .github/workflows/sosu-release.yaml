name: Create and publish Docker images with specific build args

on:
  workflow_dispatch:
  push:
    branches:
      - sosu-main
    tags:
      - 'sosu-v*'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set repository and image name to lowercase
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >>${GITHUB_ENV}
          echo "FULL_IMAGE_NAME=ghcr.io/${IMAGE_NAME,,}" >>${GITHUB_ENV}
          echo "DOCKERHUB_IMAGE_NAME=docker.io/eliassosu/sosu-open-webui" >>${GITHUB_ENV}
        env:
          IMAGE_NAME: '${{ github.repository }}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute Docker tags
        id: meta
        run: |
          set -euo pipefail
          REF="${GITHUB_REF}"
          IS_TAG=0
          IS_SOSU_V=0
          TAG_NAME=""
          SEMVER=""
          if [[ "${REF}" == refs/tags/* ]]; then
            IS_TAG=1
            TAG_NAME="${REF#refs/tags/}"
            if [[ "${TAG_NAME}" == sosu-v* ]]; then
              IS_SOSU_V=1
              SEMVER="${TAG_NAME#sosu-v}"
            fi
          fi

          declare -a RAW_TAGS=()
          RAW_TAGS+=("dev")
          if [[ -n "${SEMVER}" ]]; then
            RAW_TAGS+=("${SEMVER}")
          fi
          if [[ ${IS_TAG} -eq 1 ]]; then
            RAW_TAGS+=("${TAG_NAME}")
          fi
          if [[ ${IS_SOSU_V} -eq 1 ]]; then
            RAW_TAGS+=("latest")
          fi

          declare -A SEEN=()
          declare -a UNIQ_TAGS=()
          for t in "${RAW_TAGS[@]}"; do
            if [[ -z "${SEEN[$t]:-}" ]]; then
              SEEN[$t]=1
              UNIQ_TAGS+=("$t")
            fi
          done

          TAGS=""
          for img in "${FULL_IMAGE_NAME}" "${DOCKERHUB_IMAGE_NAME}"; do
            for t in "${UNIQ_TAGS[@]}"; do
              TAGS+="${img}:${t}"$'\n'
            done
          done

          {
            echo "tags<<EOF"
            printf "%s" "${TAGS}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          echo "Computed tags:"
          printf "%s" "${TAGS}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=sosu-open-webui
          cache-to: type=gha,mode=max,scope=sosu-open-webui
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BUILD_HASH=${{ github.sha }}